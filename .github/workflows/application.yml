name: Application regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 药衡智析_增量源码交接/public_source_candidate/05_原型
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      TMPDIR: /tmp
      OTEL_SDK_DISABLED: 'true'
      ANONYMIZED_TELEMETRY: 'False'
      PHARMA_API_KEY: ''
      GLM_API_KEY: ''
      ZHIPU_API_KEY: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked application dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.lock
          npm ci --ignore-scripts --prefix frontend
      - name: Install LibreOffice for real PDF-render tests (AUD-TST-02)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk
      - name: Synthetic regression and frontend build
        run: |
          PYTHONPATH=backend .venv/bin/python -m pytest -q tests
          npm run build --prefix frontend
          node --test frontend/record_demo_20260918.test.mjs
  # 镜像可构建性守门（2026-09-23 审计 AUD-DEP-03）：与 deploy/docker-compose.yml
  # 同一构建上下文/Dockerfile，只构建不 push——Dockerfile 或依赖漂移导致镜像
  # 无法构建时在此暴露，而不是在比赛机首次 compose up 才发现。
  docker-image-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: 药衡智析_增量源码交接/public_source_candidate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build application image (no push)
        run: docker build -f 05_原型/deploy/Dockerfile --tag yaoheng-app:ci .
      - name: Validate compose definition (AUD-DEP-05)
        run: docker compose -f 05_原型/deploy/docker-compose.yml config -q
